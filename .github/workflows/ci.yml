name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: bash scripts/secret-scan.sh --all

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # Boot a real gateway on 28799 against a stub provider on 28801 and assert
      # observable end state. Unit tests cannot prove that error classification,
      # self-check reconciliation and cron model fallback survive the plugin
      # boundary. The scripts share those ports, so they must stay sequential.
      - name: Verify (end-to-end)
        run: pnpm verify:e2e
