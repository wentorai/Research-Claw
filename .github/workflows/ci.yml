name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  unit:
    name: CI / Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # v7.0.1; its action.yml uses the current Node 24 action runtime.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Secret scan
        run: bash scripts/secret-scan.sh --all

      # v7.0.0, pinned rather than using a mutable major tag.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      # Node 22 ships Corepack; enable its shim so nested scripts can call pnpm.
      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "10.34.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  e2e:
    name: CI / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable pnpm

      - name: Verify pnpm version
        run: test "$(pnpm --version)" = "10.34.4"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Boot real isolated gateways against local stub providers and assert
      # observable runtime results. The scripts share ports, so they stay
      # sequential inside this independent job.
      - name: Verify (end-to-end)
        run: pnpm verify:e2e
